{{- if .Values.gateway.enabled }}
{{- /*  Determine whether cert-manager will provide the TLS Secret.
       Requires: certManager enabled + certificate enabled + a non-empty domain.
        CERT-MANAGER TLS BRANCH — TEMPORARILY DISABLE */}}
{{- $useCert := and .Values.certManager.enabled
                   .Values.certManager.certificate.enabled
                   .Values.certManager.certificate.domain }}

{{/* {{- $useCert := false}} */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ include "nidan.namespace" . }}
spec:
  replicas: {{ .Values.gateway.replicas }}

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway

      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

            - name: https
              containerPort: 443

            - name: gateway-8443
              containerPort: 8443

          env:
            - name: GATEWAY_CERT_SANS
              value: ""

            - name: OPENELIS_DOMAIN
              value: ""

            - name: OPENELIS_CONTEXT_PATH
              value: "/api/OpenELIS-Global/"

            - name: DASHBOARD_ODOO_URL
              value: ""

          volumeMounts:
            # ------------------------------------------------------------
            # CERT-MANAGER MOUNT — DISABLED (no domain configured yet)
            # ------------------------------------------------------------
            {{- if $useCert }}
            # Domain configured → project cert-manager's Secret into the
            # paths that nginx.conf already reads:
            #   /etc/letsencrypt/live/localhost/fullchain.pem
            #   /etc/letsencrypt/live/localhost/privkey.pem
            - name: gateway-tls
              mountPath: /etc/letsencrypt/live/localhost
              readOnly: true
            {{- else }}
            # No domain yet → writable emptyDir so the image's entrypoint
            # can generate a self-signed fallback without hitting
            # "Read-only file system" errors.
            - name: gateway-tls
              mountPath: /etc/letsencrypt
            {{- end }}

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        # CERT-MANAGER VOLUME — DISABLED (no domain configured yet)
        {{- if $useCert }}
        - name: gateway-tls
          secret:
            secretName: {{ .Values.certManager.certificate.secretName }}
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
        {{- else }}
        - name: gateway-tls
          emptyDir: {}
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ include "nidan.namespace" . }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  selector:
    app: gateway

  ports:
    - name: http
      port: 80
      targetPort: 80

    - name: https
      port: 443
      targetPort: 443

    - name: gateway-8443
      port: 8443
      targetPort: 8443
{{- end }}
