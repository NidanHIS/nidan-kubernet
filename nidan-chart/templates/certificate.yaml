{{- if and .Values.certManager.enabled
           .Values.certManager.certificate.enabled
           .Values.certManager.certificate.domain }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certManager.certificate.name }}
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: gateway
spec:
  secretName: {{ .Values.certManager.certificate.secretName }}
  issuerRef:
    name: {{ .Values.certManager.clusterIssuer.name }}
    kind: ClusterIssuer
  commonName: {{ .Values.certManager.certificate.domain }}
  dnsNames:
    - {{ .Values.certManager.certificate.domain }}
    {{- range .Values.certManager.certificate.additionalDnsNames }}
    - {{ . }}
    {{- end }}
{{- end }}
