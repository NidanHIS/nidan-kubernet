{{- if and .Values.certManager.enabled
           .Values.certManager.clusterIssuer.cloudflare.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.certManager.clusterIssuer.cloudflare.secretName }}
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: cert-manager
type: Opaque
stringData:
  {{ .Values.certManager.clusterIssuer.cloudflare.secretKey }}: {{ required "certManager.clusterIssuer.cloudflare.apiToken is required when createSecret=true" .Values.certManager.clusterIssuer.cloudflare.apiToken | quote }}
{{- end }}
