{{- if and .Values.certManager.enabled .Values.certManager.clusterIssuer.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuer.name }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: cert-manager
spec:
  acme:
    server: {{ .Values.certManager.clusterIssuer.server }}
    email: {{ .Values.certManager.clusterIssuer.email }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuer.privateKeySecretName }}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.certManager.clusterIssuer.cloudflare.secretName }}
              key: {{ .Values.certManager.clusterIssuer.cloudflare.secretKey }}
{{- end }}
