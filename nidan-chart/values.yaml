# ============================================================
# Global
# ============================================================
global:
  namespace: nidan

# ============================================================
# Gateway
# ============================================================
gateway:
  enabled: true
  image:
    repository: utsavd/nidan-proxy
    tag: latest
  replicas: 1

# ============================================================
# ACME — HTTP-01 webroot, issued by the acme.sh sidecar
# The sidecar uses the ACME challenge location that already
# exists in nginx.conf (/.well-known/acme-challenge/).
# ============================================================
acme:
  enabled: true
  email: "EMAIL-ADDRESS"        # MUST be a real, monitored email
  server: "letsencrypt"                 # use "letsencrypt_test" while debugging
  image:
    repository: neilpang/acme.sh
    tag: "3.0.7"                        # pinned — do NOT use "latest"
  storage:
    size: 200Mi
    storageClass: ""                    # "" = cluster default (RWO is fine)
  resources:
    requests: { cpu: "50m",  memory: "64Mi"  }
    limits:   { cpu: "200m", memory: "128Mi" }

# ============================================================
# cert-manager — DISABLED. Kept only because gateway.yaml still
# reads certManager.certificate.domain as $domain for the
# acme.sh --issue command. clusterIssuer / cloudflare /
# additionalDnsNames / secretName are all unused — the templates
# that referenced them have been deleted.
# ============================================================
certManager:
  enabled: false
  certificate:
    enabled: false
    domain: "YOUR-DOMAIN"

# ============================================================
# OpenMRS
# ============================================================
openmrs:
  enabled: true

  db:
    image:
      repository: trigonaltechnology/openmrs-db
      tag: latest
    replicas: 1

  backend:
    image:
      repository: trigonaltechnology/openmrs-backend
      tag: latest
    replicas: 1

  frontend:
    image:
      repository: trigonaltechnology/openmrs-frontend
      tag: latest
    replicas: 1

# ============================================================
# Odoo
# ============================================================
odoo:
  enabled: true
  image:
    repository: trigonaltechnology/nidan_odoo
    tag: latest
  replicas: 1
  db:
    image:
      repository: postgres
      tag: "15"
    replicas: 1

# ============================================================
# OpenELIS
# ============================================================
openelis:
  enabled: true

  db:
    image:
      repository: trigonaltechnology/openelis-global-2-database
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 1
    storage: 20Gi
    storageClass: ""
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "3Gi" }

  backend:
    image:
      repository: trigonaltechnology/openelis-global-2
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "3Gi" }

  frontend:
    image:
      repository: trigonaltechnology/openelis-global-2-frontend
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

  volume:
    storage: 5Gi
    storageClass: ""

  secrets:
    dbPassword: "clinlims"
    integrationDbPassword: "nidan"

# ============================================================
# Orthanc — disabled
# ============================================================
orthanc:
  enabled: true
  image:
    repository: orthancteam/orthanc
    tag: "26.6.0"
  replicas: 1
  db:
    image:
      repository: postgres
      tag: "15"
    replicas: 1
  secrets:
    dbPassword: "orthanc"
    uiPassword: "nidan"
    postgresPassword: "orthanc"

# ============================================================
# Kafka — disabled
# ============================================================
kafka:
  enabled: true
  zookeeper:
    image:
      repository: confluentinc/cp-zookeeper
      tag: "7.5.0"
    replicas: 1
  broker:
    image:
      repository: confluentinc/cp-kafka
      tag: "7.5.0"
    replicas: 1

# ============================================================
# CIS-OIS — disabled
# ============================================================
nidanCisOis:
  enabled: true
  cis:
    image:
      repository: trigonaltechnology/nidan-cis
      tag: latest
    replicas: 1
  ois:
    image:
      repository: trigonaltechnology/nidan-ois
      tag: latest
    replicas: 1

# ============================================================
# Integration DB — disabled
# ============================================================
nidanIntegrationDb:
  enabled: true
  image:
    repository: postgres
    tag: "15"
  replicas: 1

# ============================================================
# Superset — disabled
# ============================================================
superset:
  enabled: true
  image:
    repository: trigonaltechnology/superset
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  nodePort: 30088
  storage:
    home: 10Gi
    metadata: 1Gi
    storageClass: ""
  secrets:
    secretKey: "SBzPML4hj88VNBdKERD70kFGpQ08gjDGozdFeS3GVJfroaamUGWam5G58mDdvM6J"
    adminPassword: "Nidan123"
    openmrsDbPassword: "openmrs"
    openelisDbPassword: "clinlims"
    odooDbPassword: "nidan"

# ============================================================
# DHIS2 — disabled
# ============================================================
nidanDhis2:
  enabled: true
  image:
    repository: trigonaltechnology/nidan-dhis2-integration
    tag: latest
  replicas: 1
  db:
    image:
      repository: mysql
      tag: "8.0"
    replicas: 1
